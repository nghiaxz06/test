<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Code Tester</title>
    
    <!-- Thư viện CodeMirror để gõ code có màu -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/edit/matchbrackets.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1e1e1e;
            color: #fff;
            font-family: -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Thanh công cụ trên cùng */
        .toolbar {
            background: #252526;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        .toolbar h1 { font-size: 16px; color: #00b4ff; }
        
        .run-btn {
            background: #00e676;
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
        }
        .run-btn:active { transform: scale(0.95); }

        /* Khu vực gõ code */
        .editor-container {
            flex: 1;
            overflow: hidden;
            border-bottom: 2px solid #00b4ff;
        }
        .CodeMirror {
            height: 100% !important;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Khu vực hiển thị kết quả */
        .preview-container {
            flex: 1;
            background: #fff;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        /* Bảng Console log */
        .console {
            height: 120px;
            background: #000;
            color: #00e676;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            overflow-y: auto;
            border-top: 1px solid #333;
        }
        .console-line { border-bottom: 1px solid #111; padding: 2px 0; }
        .console-error { color: #ff3b5c; }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1>Mobile Tester</h1>
        <button class="run-btn" onclick="runCode()">▶ CHẠY CODE</button>
    </div>

    <!-- Vùng code -->
    <div class="editor-container">
        <textarea id="code-editor">
<!-- Gõ code HTML của anh ở đây -->
<h1 style="color: #00b4ff; text-align: center; padding: 20px;">Hello Nghiaxz.dev!</h1>
<button onclick="testFunc()" style="padding: 10px; margin: 0 20px; background: #00b4ff; color: #fff; border: none; border-radius: 5px;">Bấm thử</button>

<script>
  // Gõ code JS của anh ở đây
  function testFunc() {
      console.log("Đã bấm nút thành công!");
      alert("Chạy ngon rồi anh ơi!");
  }
  console.log("Script đã load!");
<\/script>
        </textarea>
    </div>

    <!-- Vùng Preview -->
    <div class="preview-container">
        <iframe id="preview-frame"></iframe>
    </div>

    <!-- Vùng Log -->
    <div class="console" id="console-log">
        <div class="console-line" style="color: #888;">// Hệ thống đang chờ lệnh...</div>
    </div>

    <script>
        // Khởi tạo CodeMirror
        const editor = CodeMirror.fromTextArea(document.getElementById("code-editor"), {
            mode: "htmlmixed",
            theme: "monokai",
            lineNumbers: true,
            autoCloseBrackets: true,
            matchBrackets: true,
            lineWrapping: true
        });

        const iframe = document.getElementById("preview-frame");
        const consoleBox = document.getElementById("console-log");

        // Hàm ghi log ra màn hình
        function logToConsole(msg, isError = false) {
            const line = document.createElement("div");
            line.className = "console-line" + (isError ? " console-error" : "");
            line.textContent = "> " + msg;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // Lắng nghe log từ iframe (do code JS của user chạy)
        window.addEventListener("message", (e) => {
            if (e.data.type === "log") logToConsole(e.data.msg);
            if (e.data.type === "error") logToConsole(e.data.msg, true);
        });

        // Hàm chạy code
        function runCode() {
            consoleBox.innerHTML = ""; // Xóa log cũ
            logToConsole("Đang tải code...");
            
            const userCode = editor.getValue();
            
            // Code bơm vào iframe để bắt lỗi console.log
            const injectedScript = `
                <script>
                    window.onerror = function(message, source, lineno, colno, error) {
                        window.parent.postMessage({ type: "error", msg: message + " (Dòng " + lineno + ")" }, "*");
                    };
                    const originalLog = console.log;
                    console.log = function(...args) {
                        window.parent.postMessage({ type: "log", msg: args.join(" ") }, "*");
                        originalLog.apply(console, args);
                    };
                    console.error = function(...args) {
                        window.parent.postMessage({ type: "error", msg: args.join(" ") }, "*");
                    };
                <\/script>
            `;

            // Đưa code vào khung iframe
            const finalCode = injectedScript + userCode;
            iframe.srcdoc = finalCode;
        }

        // Tự động lưu code vào máy (LocalStorage) tránh bị mất khi load lại
        editor.on("change", () => {
            localStorage.setItem("mobile_ide_code", editor.getValue());
        });

        // Load lại code cũ nếu có
        window.onload = () => {
            const savedCode = localStorage.getItem("mobile_ide_code");
            if (savedCode) {
                editor.setValue(savedCode);
            }
        };
    </script>
</body>
</html>
